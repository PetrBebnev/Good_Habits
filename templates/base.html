<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">🌱 {{ app_name }}</a>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('app_page') }}">Привычки</a>
            <a href="{{ url_for('progress') }}">Прогресс</a>
        </nav>
    </header>

    <main class="container">
    {% if error_title %}
        <div class="error-page">
            <h1>{{ error_title }}</h1>
            <p>{{ error_text }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary">← На главную</a>
        </div>
    {% else %}
        {% block content %}{% endblock %}
    {% endif %}
    </main>

    <footer class="footer">
        <p>© {{ app_name }} — трекер полезных привычек</p>
    </footer>
</body>
</html>
